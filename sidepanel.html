<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Browser Agent</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <strong>Gemini Browser Agent</strong>
    <label id="yoloLabel" title="YOLO mode: the agent acts without asking for approval and without pausing to confirm risky actions">
      <input id="yolo" type="checkbox" /> YOLO
    </label>
    <button id="notesBtn" title="The agent's notebook">Notes</button>
    <button id="historyBtn" title="Saved chats">History</button>
    <button id="newChat" title="Start a new chat (the current one stays saved)">New</button>
    <button id="exportChat" title="Download this chat as Markdown">Export</button>
  </header>

  <details id="settings">
    <summary>Settings</summary>
    <label>Provider
      <select id="provider"></select>
    </label>
    <label id="rowKey"><span id="rowKeyLabel">API key</span>
      <input id="apiKey" type="password" placeholder="API key" autocomplete="off" />
    </label>
    <label id="rowBase">Base URL
      <input id="baseUrl" type="text" placeholder="http://localhost:11434" autocomplete="off" />
    </label>
    <label>Model
      <span class="inline">
        <input id="model" type="text" list="modelList" placeholder="model name" autocomplete="off" />
        <button id="loadModels" type="button" title="List the models this provider offers">Load</button>
      </span>
      <datalist id="modelList"></datalist>
    </label>
    <label id="rowCtx">Context length (tokens)
      <input id="numCtx" type="number" min="2048" step="1024" placeholder="32768" />
    </label>
    <label class="row">
      <input id="vision" type="checkbox" />
      Model can see images (enables the screenshot tool)
    </label>
    <p id="providerHint" class="hint"></p>
    <label>Exa API key (optional, enables web search)
      <input id="exaKey" type="password" placeholder="Exa API key" autocomplete="off" />
    </label>
    <p class="hint">Get one at dashboard.exa.ai/api-keys. With a key the agent can use web_search and read_url; your queries and the URLs it reads are sent to Exa.</p>
    <label class="row">
      <input id="approve" type="checkbox" checked />
      Ask me before the agent clicks, types, navigates or changes tabs (ignored in YOLO mode)
    </label>
    <label class="row">
      <input id="unlimited" type="checkbox" />
      Unlimited steps (run until the task is done or I press Stop)
    </label>
    <label>Max steps per task
      <input id="maxSteps" type="number" min="1" step="1" value="40" />
    </label>
    <button id="save">Save</button>
    <p class="hint">API keys are stored only in this browser (chrome.storage.local) and are sent only to the provider you select.</p>
  </details>

  <section id="historyPanel" hidden>
    <div id="historyList"></div>
  </section>

  <section id="notesPanel" hidden>
    <div class="notesBar">
      <button id="noteNew">New note</button>
      <button id="notesExport" title="Download all notes as JSON">Export</button>
      <span id="notesCount" class="hint"></span>
    </div>
    <div id="notesList"></div>
    <div id="noteDetail" hidden></div>
  </section>

  <main id="log"></main>

  <footer>
    <textarea id="input" rows="2" placeholder="Tell the agent what to do in this tab…"></textarea>
    <div class="buttons">
      <button id="send">Send</button>
      <button id="stop" hidden>Stop</button>
    </div>
  </footer>

  <script src="prompt.js"></script>
  <script src="providers.js"></script>
  <script src="markdown.js"></script>
  <script src="memory.js"></script>
  <script src="exa.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
